<style>
  :root{--bg:#0F2A24;--key:#1C4036;--key2:#27594A;--amber:#F2B544;--coral:#EF6B4F;--text:#F3F7F4;--muted:#9CC2B4;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
       display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;
       padding:var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) 14px calc(14px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));user-select:none;-webkit-user-select:none}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .hidden{display:none!important}

  /* Login */
  #login{display:none;flex:1;align-items:center;justify-content:center;overflow-y:auto;padding:20px 0}
  body.locked #login{display:flex}
  body.locked header,body.locked main,body.locked #drawer,body.locked #scrim{display:none}
  #lform{width:100%;max-width:360px}
  #lform .logo{text-align:center}
  #lform .logo svg{border-radius:24px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .lg{display:block}
  header .lg{border-radius:10px;flex:none}
  #histBtn{margin-left:auto;width:44px;height:44px;border:0;border-radius:14px;background:var(--key);color:var(--text);font-size:1.3rem;cursor:pointer}
  #histBtn:active{filter:brightness(1.3)}
  #lform h2{font-size:1.8rem;text-align:center;margin-top:4px}
  #lform p{color:var(--muted);text-align:center;margin:6px 0 8px;min-height:1.3em}
  .chk{display:flex!important;align-items:center;margin-top:14px!important;color:var(--text)!important;font-size:.95rem!important}
  .chk input{display:inline-block;width:auto;margin:0 10px 0 0;transform:scale(1.3)}
  #lerr{color:#FF9B85;min-height:1.3em;margin-top:10px;font-size:.95rem}
  .primary{width:100%;padding:15px;border:0;border-radius:16px;background:var(--amber);color:#2B2005;font:inherit;font-weight:700;font-size:1.1rem;margin-top:14px;cursor:pointer}
  .primary:active{filter:brightness(.9)}
  .link{display:block;width:100%;background:none;border:0;color:var(--muted);font:inherit;margin-top:16px;text-decoration:underline;cursor:pointer}

  /* Top bar + menu */
  header{display:flex;align-items:center;gap:12px;padding:10px 0 6px}
  #menuBtn{width:44px;height:44px;border:0;border-radius:14px;background:var(--key);color:var(--text);font-size:1.5rem;cursor:pointer}
  #menuBtn:active{filter:brightness(1.3)}
  header h1{font-size:1.25rem;font-weight:700}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:min(80vw,310px);background:#0A1F1A;z-index:11;display:flex;flex-direction:column;
          transform:translateX(-102%);transition:transform .22s ease-out;padding:calc(18px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 14px 18px;
          overflow-y:auto;box-shadow:6px 0 24px rgba(0,0,0,.4)}
  body.menu #drawer{transform:none}
  body.menu #scrim{opacity:1;pointer-events:auto}
  #drawer h2{font-size:.85rem;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:6px 8px 12px}
  #list{flex:1}
  #list button,#logout{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;margin-bottom:4px;border:0;border-radius:16px;
               background:transparent;color:var(--text);font:inherit;font-size:1.08rem;text-align:left;cursor:pointer}
  #list button span{width:1.6em;text-align:center;font-size:1.3rem}
  #list button[aria-current="true"]{background:var(--key);color:var(--amber);font-weight:600}
  #drawerFoot{border-top:1px solid var(--key);padding-top:12px;margin-top:10px}
  #who{color:var(--muted);padding:0 14px 8px}
  #ver{color:var(--muted);opacity:.7;font-size:.8rem;padding:0 14px 10px}
  #logout{color:#FF9B85}
  @media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}

  /* Panels */
  main{display:flex;flex-direction:column;flex:1;min-height:0}
  .panel{display:none;flex:1;min-height:0}
  .panel.active{display:flex;flex-direction:column}
  .panel.cards{overflow-y:auto;gap:14px;padding:8px 0 24px;user-select:text;-webkit-user-select:text}

  /* Calculators (basic + scientific) */
  .screen{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 6px 12px;min-height:165px;overflow:hidden;position:relative}
  .del{position:absolute;top:6px;right:6px;width:54px;height:38px;border:0;border-radius:12px;background:var(--key2);color:#fff;font-size:1.35rem;font-weight:600;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .del:active{transform:translateY(2px);filter:brightness(.88);box-shadow:none}
  .panel.calc{overflow-y:auto}
  .expr{width:100%;font-size:clamp(2.4rem,9dvh,3.6rem);font-weight:600;color:#fff;line-height:1.2;text-align:right;white-space:nowrap;overflow:hidden;min-height:1.2em;font-variant-numeric:tabular-nums}
  .val{width:100%;color:#BFE0D3;font-size:1.35rem;font-weight:500;min-height:1.5em;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

<script>
/* ================= Login (saved on this phone only) ================= */
const ACC = "calc_account", SES = "calc_session";
const memStore = {};
let storageOK = true;
try { localStorage.setItem("_t", "1"); localStorage.removeItem("_t"); } catch(e){ storageOK = false; }
const store = {
  get(k){ try { const v = localStorage.getItem(k); if (v !== null) return v; } catch(e){} return k in memStore ? memStore[k] : null; },
  set(k, v){ memStore[k] = v; try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ delete memStore[k]; try { localStorage.removeItem(k); } catch(e){} }
};
const hasSubtle = () => typeof crypto !== "undefined" && !!crypto.subtle;
async function hashPw(pw, salt, alg){
  const data = salt + "|" + pw;
  if (alg === "s"){
    if (!hasSubtle()) return null;
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
    return "s:" + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < data.length; i++){ const ch = data.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return "c:" + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
const tmp = {
  get(k){ try { const v = sessionStorage.getItem(k); if (v !== null) return v; } catch(e){} return tmpMem[k] || null; },
  set(k, v){ tmpMem[k] = v; try { sessionStorage.setItem(k, v); } catch(e){} },
  del(k){ delete tmpMem[k]; try { sessionStorage.removeItem(k); } catch(e){} }
};
const tmpMem = {};
function startSession(){
  if ($("keep").checked){ store.set(SES, "1"); tmp.del(SES); }
  else { store.del(SES); tmp.set(SES, "1"); }
}
const signedIn = () => store.get(SES) === "1" || tmp.get(SES) === "1";
const getAccount = () => { try { return JSON.parse(store.get(ACC) || "null"); } catch(e){ return null; } };
async function createAccount(name, pw){
  const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const hash = await hashPw(pw, salt, hasSubtle() ? "s" : "c");
  store.set(ACC, JSON.stringify({ name, salt, hash }));
}
async function checkPassword(pw){
  const a = getAccount();
  if (!a) return false;
  return (await hashPw(pw, a.salt, a.hash.startsWith("s:") ? "s" : "c")) === a.hash;
}

const $ = id => document.getElementById(id);
function refreshLogin(){
  const a = getAccount();
  $("lname").parentElement.classList.toggle("hidden", !!a);
  $("lpass2L").classList.toggle("hidden", !!a);
  $("lreset").classList.toggle("hidden", !a);
  $("ltitle").textContent = a ? "Welcome back" : "Create your login";
  $("lsub").textContent = (a ? a.name : "Set a name and password for this app") + (storageOK ? "" : " (Saving is blocked here. Open the file in Chrome to keep your login.)");
  $("lgo").textContent = a ? "Sign in" : "Create account";
  $("lpass").autocomplete = a ? "current-password" : "new-password";
}
function lock(){
  document.body.classList.add("locked");
  document.body.classList.remove("menu");
  ["lname","lpass","lpass2"].forEach(i => $(i).value = "");
  $("lerr").textContent = "";
  refreshLogin();
}
function unlock(){
  const a = getAccount();
  $("who").textContent = a ? "Signed in as " + a.name : "";
  document.body.classList.remove("locked");
}
$("showpw").addEventListener("change", e => { $("lpass").type = $("lpass2").type = e.target.checked ? "text" : "password"; });
async function submitLogin(){
  const a = getAccount(), pw = $("lpass").value, err = $("lerr");
  err.textContent = "";
  if (a){
    if (await checkPassword(pw)){ startSession(); unlock(); lock_reset(); }
    else err.textContent = "Wrong password. Try again.";
  } else {
    const name = $("lname").value.trim();
    if (!name) return void (err.textContent = "Please enter your name.");
    if (pw.length < 4) return void (err.textContent = "Use at least 4 characters for the password.");
    if (pw !== $("lpass2").value) return void (err.textContent = "The two passwords don't match.");
    await createAccount(name, pw); startSession(); unlock(); lock_reset();
  }
}
$("lgo").addEventListener("click", submitLogin);
["lname","lpass","lpass2"].forEach(i => $(i).addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); submitLogin(); } }));
function lock_reset(){ ["lname","lpass","lpass2"].forEach(i => $(i).value = ""); }
let resetArmed = false;
$("lreset").addEventListener("click", () => {
  if (!resetArmed){ resetArmed = true; $("lreset").textContent = "Tap again to delete the saved login"; return; }
  resetArmed = false; $("lreset").textContent = "Forgot password? Reset";
  store.del(ACC); store.del(SES); tmp.del(SES); lock();
});
let logoutArmed = false;
$("logout").addEventListener("click", () => {
  if (!logoutArmed){ logoutArmed = true; $("logout").innerHTML = "⎋&nbsp; Tap again to log out"; return; }
  logoutArmed = false; $("logout").innerHTML = "⎋&nbsp; Log out";
  store.del(SES); tmp.del(SES); lock();
});

/* ================= History (saved until YOU delete it) ================= */
const HKEY = "calc_history";
function getHistory(){ try { const h = JSON.parse(store.get(HKEY) || "[]"); return Array.isArray(h) ? h : []; } catch(e){ return []; } }
function setHistory(h){ store.set(HKEY, JSON.stringify(h)); }
function addHistory(e, r, m){ setHistory([{ e, r, m, t: Date.now() }, ...getHistory()].slice(0, 200)); }
function histDelete(i){ const h = getHistory(); h.splice(i, 1); setHistory(h); }
function histClear(){ store.del(HKEY); }
const esc = x => String(x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= Calculator engine (basic + scientific) ================= */
const FN = ["sin", "cos", "tan", "log", "ln"];
const clean = n => Math.abs(n) < 1e-12 ? "0" : String(parseFloat(n.toPrecision(12)));
function fact(n){ if (!Number.isInteger(n) || n < 0 || n > 170) throw 1; let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

function evaluate(s, deg = true){
  const stk = []; for (const ch of s){ if ("([{".includes(ch)) stk.push(ch); else if (")]}".includes(ch)) stk.pop(); }
  s += stk.reverse().map(o => ({ "(": ")", "[": "]", "{": "}" })[o]).join("");
  const t = s.match(/\d*\.?\d+|\d+\.|sin|cos|tan|log|ln|[+−×÷()\[\]{}%√²^!πe]/g) || [];
  let i = 0;
  const peek = () => t[i], next = () => t[i++];
  const call = (f, a) => {
    const x = deg && ["sin","cos","tan"].includes(f) ? a * Math.PI / 180 : a;
    if (f === "tan" && deg && Math.abs(a % 180) === 90) throw 1;
    const r = f === "sin" ? Math.sin(x) : f === "cos" ? Math.cos(x) : f === "tan" ? Math.tan(x) : f === "log" ? Math.log10(a) : Math.log(a);
    if (!Number.isFinite(r)) throw 1;
    return r;
  };
  function expr(){ let v = term(); while (peek()==="+"||peek()==="−"){ const o = next(), r = term(); v = o==="+" ? v+r : v-r; } return v; }
  function term(){ let v = unary(); while (peek()==="×"||peek()==="÷"){ const o = next(), r = unary(); v = o==="×" ? v*r : v/r; } return v; }
  function unary(){ if (peek()==="−"){ next(); return -unary(); } if (peek()==="+"){ next(); return unary(); } return pow(); }
  function pow(){
    const b = post();
    if (peek() === "^"){ next(); const r = Math.pow(b, unary()); if (!Number.isFinite(r)) throw 1; return r; }
    return b;
  }
  function post(){
    let v = prim();
    while (["%","²","!"].includes(peek())){ const o = next(); v = o==="%" ? v/100 : o==="²" ? v*v : fact(v); }
    return v;
  }
  function prim(){
    const x = next();
    if (x === "√"){ const r = Math.sqrt(prim()); if (Number.isNaN(r)) throw 1; return r; }
    if (FN.includes(x)) return call(x, prim());
    if (x === "π") return Math.PI;
    if (x === "e") return Math.E;
    if (x === "(" || x === "[" || x === "{"){ const v = expr(); if (next() !== { "(": ")", "[": "]", "{": "}" }[x]) throw 0; return v; }
    if (x === undefined || isNaN(Number(x))) throw 0;
    return Number(x);
  }
  const v = expr();
  if (i < t.length) throw 0;
  return v;
}

function makeCalc(id, sci){
  const panel = document.createElement("section");
  panel.className = "panel calc" + (sci ? " sci" : "");
  panel.id = "p-" + id;
  const B = (k, l, c = "", a = "") => `<button data-k="${k}" class="${c}"${a ? ` aria-label="${a}"` : ""}>${l}</button>`;
  const num = k => B(k, k, "num");
  const pad = sci
    ? [B("C","AC","fn"),B("back","⌫","fn","Delete"),B("%","%","fn"),B("÷","÷","op"),
       num("7"),num("8"),num("9"),B("×","×","op"),num("4"),num("5"),num("6"),B("−","−","op"),
       num("1"),num("2"),num("3"),B("+","+","op"),B("0","0","num wide"),num("."),B("=","=","eq")]
    : [B("C","AC","fn"),B("(","(","fn"),B(")",")","fn"),B("back","⌫","fn","Delete"),
       B("√","√","fn","Square root"),B("²","x²","fn","Square"),B("%","%","fn"),B("÷","÷","op"),
       num("7"),num("8"),num("9"),B("×","×","op"),num("4"),num("5"),num("6"),B("−","−","op"),
       num("1"),num("2"),num("3"),B("+","+","op"),B("0","0","num wide"),num("."),B("=","=","eq")];
  const sciKeys = sci ? [
    B("sin","sin"),B("cos","cos"),B("tan","tan"),B("log","log"),B("ln","ln"),
    B("√","√","","Square root"),B("²","x²","","Square"),B("^","xʸ","","Power"),B("π","π"),B("e","e"),
    B("(","("),B(")",")"),B("!","n!","","Factorial"),B("inv","1/x","","One divided by x"),B("deg","DEG","","Switch degrees and radians")
  ].map(h => h).join("") : "";
  const brk = `<div class="brk">${B("[", "[", "fn", "Open square bracket")}${B("]", "]", "fn", "Close square bracket")}${B("{", "{", "fn", "Open curly bracket")}${B("}", "}", "fn", "Close curly bracket")}</div>`;
  panel.innerHTML = `<div class="screen"><button class="del" data-k="back" aria-label="Delete last digit">⌫</button><div class="expr" aria-live="polite">0</div><div class="val"></div></div>` + brk +
    (sci ? `<div class="sciKeys">${sciKeys}</div>` : "") + `<div class="pad">${pad.join("")}</div>`;

  const exprEl = panel.querySelector(".expr"), valEl = panel.querySelector(".val"), degBtn = panel.querySelector('[data-k="deg"]');
  let exp = "", done = false, deg = true;
  const last = () => exp.slice(-1);
  const isNumEnd = c => /[0-9.)\]}%²!πe]/.test(c);
  const closeEnd = c => /[)\]}%²!πe]/.test(c);
  const openStack = () => { const st = []; for (const ch of exp){ if ("([{".includes(ch)) st.push(ch); else if (")]}".includes(ch)) st.pop(); } return st; };

  function fit(){
    exprEl.style.fontSize = "";
    if (typeof getComputedStyle !== "function") return;
    let size = parseFloat(getComputedStyle(exprEl).fontSize) || 40;
    while (exprEl.scrollWidth > exprEl.clientWidth && size > 18){ size -= 2; exprEl.style.fontSize = size + "px"; }
  }
  function render(){
    exprEl.textContent = exp || "0";
    fit();
    let p = "";
    if (!done && /[^0-9.]/.test(exp.replace(/^−/, ""))) {
      try { const r = evaluate(exp, deg); p = isFinite(r) ? "= " + clean(r) : ""; } catch(e){}
    }
    valEl.textContent = p;
  }

  function press(k){
    if (k === "C"){ exp = ""; done = false; return render(); }
    if (k === "back"){ exp = done ? "" : exp.replace(/(?:sin|cos|tan|log|ln)\($|[\s\S]$/, ""); done = false; return render(); }
    if (k === "deg"){ deg = !deg; degBtn.textContent = deg ? "DEG" : "RAD"; return render(); }
    if (k === "inv"){ if (exp){ exp = "1÷(" + exp + ")"; done = false; } return render(); }
    if (k === "="){
      if (!exp) return;
      try {
        const r = evaluate(exp, deg);
        if (!Number.isFinite(r)){ valEl.textContent = "Can't divide by 0"; return; }
        const s = clean(r);
        if (/e/.test(s)){ valEl.textContent = "= " + s; return; }
        valEl.textContent = exp + " =";
        const shown = s.replace("-", "−");
        if (exp !== shown) addHistory(exp, shown, sci ? "Scientific" : "Basic");
        exp = shown; done = true;
        exprEl.textContent = exp; fit();
      } catch(e){ valEl.textContent = e === 1 ? "Not a valid number" : "Check the sum"; }
      return;
    }
    const c = last();
    if (/[0-9]/.test(k)){
      if (done){ exp = ""; done = false; } else if (closeEnd(c)) exp += "×";
      if (/(^|[^0-9.])0$/.test(exp)) exp = exp.slice(0, -1);
      exp += k;
    } else if (k === "."){
      if (done){ exp = ""; done = false; }
      const n = exp.split(/[^0-9.]/).pop();
      if (n.includes(".")) return;
      if (closeEnd(c)) exp += "×";
      exp += n === "" ? "0." : ".";
    } else if (k === "(" || k === "[" || k === "{"){
      if (done) done = false;
      if (isNumEnd(c)) exp += "×";
      exp += k;
    } else if (k === ")" || k === "]" || k === "}"){
      const st = openStack(), want = { ")": "(", "]": "[", "}": "{" }[k];
      if (st.length && st[st.length - 1] === want && isNumEnd(c) && c !== ".") exp += k;
    } else if (k === "√"){
      if (done){ exp = "√(" + exp + ")"; done = false; }
      else { if (isNumEnd(c)) exp += "×"; exp += "√"; }
    } else if (FN.includes(k)){
      if (done){ exp = k + "(" + exp + ")"; done = false; }
      else { if (isNumEnd(c)) exp += "×"; exp += k + "("; }
    } else if (k === "π" || k === "e"){
      if (done){ exp = ""; done = false; } else if (isNumEnd(c)) exp += "×";
      exp += k;
    } else if (k === "²" || k === "!" || k === "%"){
      if (isNumEnd(c) && c !== "."){ exp += k; done = false; }
    } else if (k === "^"){
      if (isNumEnd(c) && c !== "."){ exp += "^"; done = false; }
    } else { // + − × ÷
      done = false;
      if (!exp){ if (k === "−") exp = "−"; }
      else if ("([{^".includes(c)){ if (k === "−") exp += "−"; }
      else if (c === "√") return;
      else if ("+−×÷".includes(c)){
        if (exp.length === 1){ if (k === "−") return; }
        else exp = exp.slice(0, -1) + k;
      } else if (c !== ".") exp += k;
    }
    render();
  }
  panel.addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b) press(b.dataset.k); });
  render();
  return { panel, press, getExp: () => exp, setResult(v){ exp = v; done = true; render(); } };
}

const UNITS = {
  "Length": {"Millimetre":0.001,"Centimetre":0.01,"Metre":1,"Kilometre":1000,"Inch":0.0254,"Foot":0.3048,"Yard":0.9144,"Mile":1609.344},
  "Weight": {"Milligram":1e-6,"Gram":0.001,"Kilogram":1,"Tonne":1000,"Ounce":0.028349523125,"Pound":0.45359237},
  "Area": {"Sq metre":1,"Sq foot":0.09290304,"Sq yard":0.83612736,"Cent":40.468564224,"Acre":4046.8564224,"Hectare":10000,"Sq km":1e6},
  "Volume": {"Millilitre":0.001,"Litre":1,"Cubic metre":1000,"Cup (US)":0.2365882365,"Gallon (US)":3.785411784},
  "Speed": {"m/s":1,"km/h":1/3.6,"mph":0.44704,"Knot":1852/3600},
  "Time": {"Second":1,"Minute":60,"Hour":3600,"Day":86400,"Week":604800},
  "Temperature": {"Celsius":0,"Fahrenheit":0,"Kelvin":0}
};
function convert(type, val, from, to){
  if (type === "Temperature"){
    const c = from === "Celsius" ? val : from === "Fahrenheit" ? (val - 32) * 5 / 9 : val - 273.15;
    return to === "Celsius" ? c : to === "Fahrenheit" ? c * 9 / 5 + 32 : c + 273.15;
  }
  return val * UNITS[type][from] / UNITS[type][to];
}
const fmtU = n => parseFloat(n.toPrecision(10)).toLocaleString(undefined, {maximumFractionDigits: 8});

function buildUnit(){
  const panel = document.createElement("section");
  panel.className = "panel cards"; panel.id = "p-unit";
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `<h3>Unit converter</h3>
    <label>Type<select class="uType">${Object.keys(UNITS).map(t => `<option>${t}</option>`).join("")}</select></label>
    <label>Value<input class="uVal" type="number" inputmode="decimal" step="any"></label>
    <label>From<select class="uFrom"></select></label>
    <label>To<select class="uTo"></select></label>
    <button class="swap" type="button">⇄ Swap units</button>
    <div class="res"></div>`;
  panel.append(el);
  const q = s => el.querySelector(s), tSel = q(".uType"), fSel = q(".uFrom"), toSel = q(".uTo"), vIn = q(".uVal"), out = q(".res");
  function fill(){
    const names = Object.keys(UNITS[tSel.value]);
    fSel.innerHTML = toSel.innerHTML = names.map(n => `<option>${n}</option>`).join("");
    toSel.selectedIndex = Math.min(1, names.length - 1);

    const r = convert(tSel.value, v, fSel.value, toSel.value);

      `<div class="row"><span>1 ${fSel.value}</span><b>${fmtU(convert(tSel.value, 1, fSel.value, toSel.value))} ${toSel.value}</b></div>`;
  }
  tSel.addEventListener("change", fill);
  [vIn, fSel, toSel].forEach(x => { x.addEventListener("input", update); x.addEventListener("change", update); });
  q(".swap").addEventListener("click", () => { const a = fSel.selectedIndex; fSel.selectedIndex = toSel.selectedIndex; toSel.selectedIndex = a; update(); });

  function render(){
    const h = getHistory();
    el.innerHTML = `<h3>History</h3><p class="hint">Saved when you press =. AC and ⌫ never delete it. Only you can delete it, here.</p>` +
      (storageOK ? "" : `<p class="hint">Saving is blocked in this viewer. Open the file in Chrome to keep your history.</p>`) +
      (h.length ? `<div class="hist">` + h.map((x, i) =>
        `<div class="hrow"><button class="use" data-use="${i}"><span class="he">${esc(x.e)} =</span><b>${esc(x.r)}</b><small>${when(x.t)} · ${esc(x.m)}</small></button>` +
        `<button class="x${one === i ? " armed" : ""}" data-del="${i}" aria-label="Delete this one">${one === i ? "Delete?" : "✕"}</button></div>`).join("") +
        `</div><button class="swap danger" data-all="1">${all ? "Tap again to delete ALL" : "Delete all history"}</button>`
        : `<p class="hint" style="margin-top:12px">Nothing saved yet.</p>`);
  }
  el.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.use !== undefined){
      const x = getHistory()[Number(d.use)]; one = -1; all = false;
      if (x){ basic.setResult(x.r); show("basic"); return; }
    } else if (d.del !== undefined){
      const i = Number(d.del);
      if (one === i){ histDelete(i); one = -1; } else one = i;
      all = false;
    } else if (d.all !== undefined){
      if (all){ histClear(); all = false; } else { all = true; one = -1; }
    }
    render();
  });
  return { panel, render, reset(){ one = -1; all = false; } };
}

  function makeQuestions(topic, lvl, n){
    const out = [], seen = new Set(); let guard = 0;
    while (out.length < n && guard++ < n * 40){
      const g = pick(topic.levels[lvl])();
      if (!g || seen.has(g.q) || g.wrongs.length < 3) continue;
      seen.add(g.q); out.push(g);
    }
    return out;
  }
  const finalize = g => { const opts = shuffle([g.correct].concat(g.wrongs.slice(0, 3))); return { q: g.q, e: g.e, opts, ci: opts.indexOf(g.correct) }; };

    const setP = p => store.set(PKEY, JSON.stringify(p));
    function record(key, lvl, score, total){
      const p = getP(); p[key] = p[key] || {}; const o = p[key][lvl] || { best: 0, tries: 0 };
      o.best = Math.max(o.best, score); o.tries++; o.last = score; o.total = total; p[key][lvl] = o; setP(p);
    }
    const best = (key, lvl) => { const o = (getP()[key] || {})[lvl]; return o ? o.best + "/" + o.total : "–"; };

    function startQuiz(t, lvl){
      const qs = makeQuestions(t, lvl, 10).map(finalize);
      quiz = { title: t.name + " · " + lvl, qs, i: 0, score: 0, answered: -1, wrongs: [], key: t.id, lvl, mock: false, t0: Date.now() };
      view = "quiz";
    }
    function startMock(){
      const qs = []; let guard = 0;
      while (qs.length < 20 && guard++ < 400){
        const t = pick(TOPICS), lvl = pick(["Basic","Basic","Medium","Medium","Medium","Advanced","Advanced"]), g = pick(t.levels[lvl])();
        if (!g || g.wrongs.length < 3 || qs.some(x => x.q === g.q)) continue;
        qs.push(finalize(g));
      }
      quiz = { title: "Placement Mock Test", qs, i: 0, score: 0, answered: -1, wrongs: [], key: "mock", lvl: "All", mock: true, t0: Date.now() };
      view = "quiz";
    }
    function render(){
      if (view === "home"){
        const p = getP();
        el.innerHTML = `<h3>🎓 Aptitude Practice</h3><p class="hint">Placement preparation. Pick a topic, read the notes, then practise Basic → Medium → Advanced.</p><div class="apt-list">` +
          `<button class="tbtn mock" data-act="mock"><span class="ic">🎯</span><span><b>Mock Test</b><small>20 mixed questions · best ${best("mock", "All")}</small></span></button>` +
          TOPICS.map(t => `<button class="tbtn" data-act="topic" data-id="${t.id}"><span class="ic">${esc(t.icon)}</span><span><b>${esc(t.name)}</b><small>Basic ${best(t.id, "Basic")} · Medium ${best(t.id, "Medium")} · Adv ${best(t.id, "Advanced")}</small></span></button>`).join("") +
          `</div><p class="hint" style="margin-top:12px">Your scores are saved. Only you can delete them.</p><button class="swap danger" data-act="reset">${armed ? "Tap again to delete my scores" : "Delete my scores"}</button>`;
      } else if (view === "topic"){
        el.innerHTML = `<h3>${esc(topic.icon)} ${esc(topic.name)}</h3><div class="apt-list">` +
          `<button class="tbtn" data-act="notes"><span class="ic">📘</span><span><b>Notes and formulas</b><small>Read this first</small></span></button>` +
          LV.map((l, i) => `<button class="tbtn" data-act="level" data-lvl="${l}"><span class="ic">${i + 1}</span><span><b>${l}</b><small>${LVDESC[l]} · best ${best(topic.id, l)}</small></span></button>`).join("") +
          `</div><button class="swap" data-act="home">← All topics</button>`;
      } else if (view === "notes"){
        el.innerHTML = `<h3>📘 ${esc(topic.name)}</h3>` + topic.notes.map(n => `<div class="noteli">• ${esc(n)}</div>`).join("") + `<button class="swap" data-act="topic" data-id="${topic.id}">← Back</button>`;
      } else if (view === "quiz"){
        const q = quiz.qs[quiz.i], done = quiz.answered >= 0, last = quiz.i + 1 === quiz.qs.length;
        el.innerHTML = `<div class="aptHead"><span>${esc(quiz.title)}</span><b>${quiz.i + 1}/${quiz.qs.length}</b></div><div class="bar"><i style="width:${quiz.i / quiz.qs.length * 100}%"></i></div><p class="aq">${esc(q.q)}</p>` +
          q.opts.map((o, i) => `<button class="opt${done ? (i === q.ci ? " good" : i === quiz.answered ? " bad" : "") : ""}" data-act="opt" data-i="${i}">${esc(o)}</button>`).join("") +
          (done ? `<div class="expl">${quiz.answered === q.ci ? "✅ Correct." : "❌ Not correct."} ${esc(q.e)}</div><button class="swap" data-act="next">${last ? "See result" : "Next ▶"}</button>` : "") +
          `<button class="quit" data-act="quit">✕ Quit</button>`;
      } else if (view === "result"){
        const n = quiz.qs.length, pct = Math.round(quiz.score / n * 100), secs = Math.round((Date.now() - quiz.t0) / 1000);
        const msg = pct >= 90 ? "Excellent! You are placement ready 🔥" : pct >= 70 ? "Good work. Keep practising 👍" : pct >= 50 ? "Fair. Read the notes and try again." : "Read the notes first, then try again.";
        const ni = LV.indexOf(quiz.lvl);
        el.innerHTML = `<h3>${esc(quiz.title)}</h3><div class="big">${quiz.score}/${n}</div><p class="hint" style="text-align:center">${pct}% · ${Math.floor(secs / 60)}m ${secs % 60}s<br>${msg}</p>` +
          (quiz.wrongs.length ? `<h3 style="margin-top:14px">Review your mistakes</h3>` + quiz.wrongs.map(q => `<div class="rev"><b>${esc(q.q)}</b><br>Answer: <span class="ok">${esc(q.opts[q.ci])}</span><br><small>${esc(q.e)}</small></div>`).join("") : "") +
          `<button class="swap" data-act="again">Try again (new questions)</button>` +
          (!quiz.mock && ni >= 0 && ni < 2 ? `<button class="swap" data-act="level" data-lvl="${LV[ni + 1]}">Next level: ${LV[ni + 1]} ▶</button>` : "") +
          `<button class="swap" data-act="${quiz.mock ? "home" : "topic"}" data-id="${quiz.key}">← Back</button>`;
      }
      panel.scrollTop = 0;
    }
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b || !b.dataset.act) return;
      const d = b.dataset, a = d.act;
      if (a !== "reset") armed = false;
      if (a === "home") view = "home";
      else if (a === "topic"){ if (d.id) topic = TOPICS.find(t => t.id === d.id) || topic; view = "topic"; }
      else if (a === "notes") view = "notes";
      else if (a === "level") startQuiz(topic, d.lvl);
      else if (a === "mock") startMock();
      else if (a === "again"){ if (quiz.mock) startMock(); else startQuiz(topic, quiz.lvl); }
      else if (a === "quit"){ view = quiz && quiz.mock ? "home" : "topic"; quiz = null; }
      else if (a === "reset"){ if (armed){ setP({}); armed = false; } else armed = true; }
      else if (a === "opt"){
        if (quiz.answered >= 0) return;
        const q = quiz.qs[quiz.i]; quiz.answered = Number(d.i);
        if (quiz.answered === q.ci) quiz.score++; else quiz.wrongs.push(q);
      }
      else if (a === "next"){
        if (quiz.i + 1 < quiz.qs.length){ quiz.i++; quiz.answered = -1; }
        else { record(quiz.key, quiz.lvl, quiz.score, quiz.qs.length); view = "result"; }
      }
      render();
    });
    return { panel, render, open(){ view = "home"; quiz = null; armed = false; render(); } };
  }
  build.TOPICS = TOPICS; build.makeQuestions = makeQuestions; build.finalize = finalize;
  return build;
})();
